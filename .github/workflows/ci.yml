name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_DISABLE_METRICS: "1"
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ninja-release-linux
          - os: ubuntu-latest
            preset: ninja-debug-linux
          - os: ubuntu-latest
            preset: ninja-asan-linux
          - os: windows-latest
            preset: ninja-release-windows
          - os: windows-latest
            preset: ninja-debug-windows
          - os: windows-latest
            preset: ninja-asan-windows
          - os: macos-latest
            preset: ninja-release-macos
          - os: macos-latest
            preset: ninja-debug-macos
          - os: macos-latest
            preset: ninja-asan-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable vcpkg GitHub Actions binary cache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      # The pinned clang-format, ahead of any the runner image already ships.
      # clang-format's output is not stable across major versions, so leaving
      # this to PATH means the Ubuntu, macOS and Windows images each run a
      # different one — which is how a commit passes two OSes and fails the
      # third on formatting alone. The version comes from .clang-format-version,
      # the same file CMake checks against.
      - name: Set up Python for clang-format
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned clang-format
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .clang-format-version)"
          python -m pip install --quiet "clang-format==${version}"
          # Python prints its scripts directory in the native form each OS's
          # PATH expects, which avoids hand-converting paths on Windows. Entries
          # written to GITHUB_PATH are prepended, so this wins over the
          # clang-format the runner image already has (/usr/bin/clang-format on
          # Ubuntu is a different major version).
          python -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"
          clang-format --version

      - name: Install Ninja via Homebrew (macOS only)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Vulkan SDK (Linux/Windows)
        if: runner.os != 'macOS'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Cache Vulkan SDK (macOS)
        if: runner.os == 'macOS'
        id: vulkan-cache-macos
        uses: actions/cache@v5
        with:
          path: ~/VulkanSDK/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-macos-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK (macOS)
        if: runner.os == 'macOS' && steps.vulkan-cache-macos.outputs.cache-hit != 'true'
        run: |
          curl -sL -o vulkan_sdk.zip \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkan_sdk.zip"
          unzip -q vulkan_sdk.zip
          sudo "./vulkansdk-macOS-${VULKAN_SDK_VERSION}.app/Contents/MacOS/vulkansdk-macOS-${VULKAN_SDK_VERSION}" \
            --root "$HOME/VulkanSDK/${VULKAN_SDK_VERSION}" \
            --accept-licenses --default-answer --confirm-command install

      - name: Set Vulkan SDK env vars (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "VULKAN_SDK=$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS" >> "$GITHUB_ENV"
          echo "$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS/bin" >> "$GITHUB_PATH"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 0b88aacde46a853151730fbe7d0b7ee45f4b6864

      - name: Enable MSVC dev prompt (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup ccache (Linux only)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.preset }}
          max-size: 500M

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Header self-containment check
        id: header-check
        continue-on-error: true
        run: cmake --build --preset ${{ matrix.preset }} --target HeaderSelfContainment

      - name: Format check
        id: format-check
        continue-on-error: true
        run: cmake --build --preset ${{ matrix.preset }} --target format-check

      - name: Catch2 tests
        id: catch2-tests
        continue-on-error: true
        run: ctest --test-dir build/${{ matrix.preset }} -L unit --output-on-failure

      - name: Fail if any check failed
        if: steps.header-check.outcome == 'failure' || steps.format-check.outcome == 'failure' || steps.catch2-tests.outcome == 'failure'
        run: |
          echo "One or more checks failed:"
          echo "  Header self-containment: ${{ steps.header-check.outcome }}"
          echo "  Format check: ${{ steps.format-check.outcome }}"
          echo "  Catch2 tests: ${{ steps.catch2-tests.outcome }}"
          exit 1
