name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_DISABLE_METRICS: "1"
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  # The checks whose answer cannot differ between configurations, run once
  # instead of nine times. All three are source-level: they need clang-format
  # and the files, and nothing else — no vcpkg, no Vulkan SDK, no compiler. That
  # is also why they are a separate job rather than steps in the matrix: here
  # they report in about a minute, and they still report when the build is
  # broken, whereas in the matrix they ran in the eleventh minute of nine
  # parallel builds and only if the build had succeeded.
  #
  # HeaderSelfContainment deliberately stays in the matrix: it compiles headers
  # with the platform's compiler and standard library, and that difference is
  # the whole point of it — libstdc++ supplies <cstdint> transitively where MSVC
  # does not. It is config-independent though, so it runs in the debug job of
  # each OS rather than in all nine.
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up Python for clang-format
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pinned clang-format, ahead of any the runner image already ships:
      # clang-format's output is not stable across major versions, and
      # /usr/bin/clang-format on Ubuntu is a different one. The version comes
      # from .clang-format-version, the same file CMake checks against.
      - name: Install pinned clang-format
        run: |
          version="$(tr -d '[:space:]' < .clang-format-version)"
          python -m pip install --quiet "clang-format==${version}"
          python -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"
          clang-format --version

      - name: Format check
        id: format-check
        continue-on-error: true
        run: cmake -P cmake/Format.cmake

      - name: RHI boundary check
        id: boundary-check
        continue-on-error: true
        run: cmake -P cmake/RhiBoundaryCheck.cmake

      - name: Namespace check
        id: namespace-check
        continue-on-error: true
        run: cmake -P cmake/NamespaceCheck.cmake

      # continue-on-error above, and one gate here, so that a run reports every
      # violation it found rather than only the first.
      - name: Fail if any check failed
        if: steps.format-check.outcome == 'failure' || steps.boundary-check.outcome == 'failure' || steps.namespace-check.outcome == 'failure'
        run: |
          echo "One or more static checks failed:"
          echo "  Format:       ${{ steps.format-check.outcome }}"
          echo "  RHI boundary: ${{ steps.boundary-check.outcome }}"
          echo "  Namespace:    ${{ steps.namespace-check.outcome }}"
          exit 1

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ninja-release-linux
          - os: ubuntu-latest
            preset: ninja-debug-linux
          - os: ubuntu-latest
            preset: ninja-asan-linux
          - os: windows-latest
            preset: ninja-release-windows
          - os: windows-latest
            preset: ninja-debug-windows
          - os: windows-latest
            preset: ninja-asan-windows
          - os: macos-latest
            preset: ninja-release-macos
          - os: macos-latest
            preset: ninja-debug-macos
          - os: macos-latest
            preset: ninja-asan-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable vcpkg GitHub Actions binary cache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Ninja via Homebrew (macOS only)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Vulkan SDK (Linux/Windows)
        if: runner.os != 'macOS'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Cache Vulkan SDK (macOS)
        if: runner.os == 'macOS'
        id: vulkan-cache-macos
        uses: actions/cache@v5
        with:
          path: ~/VulkanSDK/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-macos-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK (macOS)
        if: runner.os == 'macOS' && steps.vulkan-cache-macos.outputs.cache-hit != 'true'
        run: |
          curl -sL -o vulkan_sdk.zip \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkan_sdk.zip"
          unzip -q vulkan_sdk.zip
          sudo "./vulkansdk-macOS-${VULKAN_SDK_VERSION}.app/Contents/MacOS/vulkansdk-macOS-${VULKAN_SDK_VERSION}" \
            --root "$HOME/VulkanSDK/${VULKAN_SDK_VERSION}" \
            --accept-licenses --default-answer --confirm-command install

      - name: Set Vulkan SDK env vars (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "VULKAN_SDK=$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS" >> "$GITHUB_ENV"
          echo "$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS/bin" >> "$GITHUB_PATH"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 0b88aacde46a853151730fbe7d0b7ee45f4b6864

      - name: Enable MSVC dev prompt (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup ccache (Linux only)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.preset }}
          max-size: 500M

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Config-independent — debug, release and asan compile the same headers to
      # the same verdict — but not OS-independent, which is the reason it runs
      # per OS rather than once in the static-checks job.
      - name: Header self-containment check
        id: header-check
        if: contains(matrix.preset, 'debug')
        continue-on-error: true
        run: cmake --build --preset ${{ matrix.preset }} --target HeaderSelfContainment

      - name: Catch2 tests
        id: catch2-tests
        continue-on-error: true
        run: ctest --test-dir build/${{ matrix.preset }} -L unit --output-on-failure

      # header-check reports "skipped" in the six non-debug jobs, which is not a
      # failure and so passes this gate.
      - name: Fail if any check failed
        if: steps.header-check.outcome == 'failure' || steps.catch2-tests.outcome == 'failure'
        run: |
          echo "One or more checks failed:"
          echo "  Header self-containment: ${{ steps.header-check.outcome }}"
          echo "  Catch2 tests: ${{ steps.catch2-tests.outcome }}"
          exit 1
